services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wes
      POSTGRES_PASSWORD: wes
      POSTGRES_DB: wes
    ports:
      - "5432:5432"
    volumes:
      - wes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wes -d wes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  wes_postgres_data:
