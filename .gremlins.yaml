# gremlins (github.com/go-gremlins/gremlins) configuration — pinned so mutation
# runs are reproducible between a developer's machine and CI, and so the
# test-quality sensor can FAIL the build when it regresses.
#
# Discovered automatically: gremlins looks for `.gremlins.yaml` at the Go module
# root. Both CI mutation jobs pick it up:
#   - `mutation-fast` (every push/PR) -> gremlins unleash ./internal/domain/release
#   - `mutation`      (schedule/dispatch) -> gremlins unleash ./internal/domain
#
# Measured on 2026-08-23 with gremlins v0.6.0:
#   ./internal/domain/release  -> 25 mutants, killed 25 / lived 0, efficacy 100.00%, 1m27s
#   ./internal/domain          -> 51 mutants, killed 51 / lived 0, efficacy 100.00%, 2m00s
# Thresholds are set at 95 — just below the measured 100% — so they lock in
# today's quality and catch a regression, without going red on a single flake
# (same philosophy as the 90% coverage gate on an already-higher number).

silent: false

unleash:
  # Matches the flags the existing CI mutation job has always used.
  workers: 1
  timeout-coefficient: 30

  threshold:
    # efficacy = KILLED / (KILLED + LIVED)
    efficacy: 95
    # mutant-coverage = (KILLED + LIVED) / TOTAL mutants
    mutant-coverage: 95
