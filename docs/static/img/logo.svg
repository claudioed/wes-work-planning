<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="WES Work Planning and Release">
  <title>WES Work Planning &amp; Release</title>
  <!-- The work pool: a queue of units ordered by CPT, draining left to right. -->
  <rect x="2" y="6" width="8" height="36" rx="2" fill="currentColor" opacity="0.25"/>
  <rect x="12" y="12" width="8" height="30" rx="2" fill="currentColor" opacity="0.45"/>
  <rect x="22" y="20" width="8" height="22" rx="2" fill="currentColor" opacity="0.7"/>
  <rect x="32" y="30" width="8" height="12" rx="2" fill="currentColor"/>
  <!-- The drum: CPT, the deadline the release policy pulls against. -->
  <circle cx="40" cy="10" r="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <path d="M40 6.5V10l2.5 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
</svg>
