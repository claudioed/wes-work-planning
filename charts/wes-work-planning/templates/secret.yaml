{{- if and .Values.database.url (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wes-work-planning.databaseSecretName" . }}
  labels:
    {{- include "wes-work-planning.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
{{- end }}
{{- if and (or .Values.auth.readKey .Values.auth.readWriteKey .Values.inventoryStorage.apiKey) (not .Values.auth.existingSecret) }}
---
# REST identity (ADR-0015): the static bearer keys this service ACCEPTS
# (API_READ_KEY / API_READWRITE_KEY) and the key it PRESENTS to
# inventory-storage (INVENTORY_STORAGE_API_KEY). Each entry is rendered only
# when non-empty so a missing scope is unobtainable (fail closed) rather than
# an empty string.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wes-work-planning.authSecretName" . }}
  labels:
    {{- include "wes-work-planning.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.readKey }}
  API_READ_KEY: {{ .Values.auth.readKey | quote }}
  {{- end }}
  {{- if .Values.auth.readWriteKey }}
  API_READWRITE_KEY: {{ .Values.auth.readWriteKey | quote }}
  {{- end }}
  {{- if .Values.inventoryStorage.apiKey }}
  INVENTORY_STORAGE_API_KEY: {{ .Values.inventoryStorage.apiKey | quote }}
  {{- end }}
{{- end }}
