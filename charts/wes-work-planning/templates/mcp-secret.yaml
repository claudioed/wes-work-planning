{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "wes-work-planning.mcpSecretName" . }}
  labels:
    {{- include "wes-work-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
type: Opaque
stringData:
  {{- if .Values.mcp.readKey }}
  # Bearer key granting read scope (telemetry, rebalance, report tools).
  MCP_READ_KEY: {{ .Values.mcp.readKey | quote }}
  {{- end }}
  {{- if .Values.mcp.readWriteKey }}
  # Bearer key granting read-write scope (adds release_next_work).
  MCP_READWRITE_KEY: {{ .Values.mcp.readWriteKey | quote }}
  {{- end }}
{{- end }}
