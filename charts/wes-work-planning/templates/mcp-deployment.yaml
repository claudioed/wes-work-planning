{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wes-work-planning.mcpFullname" . }}
  labels:
    {{- include "wes-work-planning.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "wes-work-planning.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      annotations:
        checksum/mcp-secret: {{ include (print $.Template.BasePath "/mcp-secret.yaml") . | sha256sum }}
      labels:
        {{- include "wes-work-planning.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "wes-work-planning.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            # The MCP binary runs the SAME use cases as cmd/wes over the same
            # OLTP database (ADR-0008); it reuses the OLTP DATABASE_URL secret.
            {{- if or .Values.database.url .Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "wes-work-planning.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- end }}
            # Static bearer keys (ADR-0008): read scope and read-write scope.
            # Both are optional at the secret level; a missing key means that
            # scope is simply not grantable (fail closed), never open access.
            - name: MCP_READ_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wes-work-planning.mcpSecretName" . }}
                  key: MCP_READ_KEY
                  optional: true
            - name: MCP_READWRITE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wes-work-planning.mcpSecretName" . }}
                  key: MCP_READWRITE_KEY
                  optional: true
            {{- if .Values.mcp.reportsBaseUrl }}
            - name: REPORTS_BASE_URL
              value: {{ .Values.mcp.reportsBaseUrl | quote }}
            {{- else if .Values.analytics.enabled }}
            # Point the get_release_throughput_report tool at this release's
            # own reports Service (ADR-0011) when analytics is deployed.
            - name: REPORTS_BASE_URL
              value: "http://{{ include "wes-work-planning.reportsFullname" . }}:{{ .Values.analytics.reports.service.port }}"
            {{- end }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "wes-work-planning-mcp"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
